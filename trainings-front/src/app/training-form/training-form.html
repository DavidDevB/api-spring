<h2>{{ trainingId() ? 'Modifier la formation' : 'Nouvelle formation' }}</h2>

@if (error()) {
  <p class="alert">{{ error() }}</p>
}

<form [formGroup]="form" (ngSubmit)="save()">
  <label>
    Nom *
    <input formControlName="name" />
    @if (form.controls.name.touched && form.controls.name.invalid) {
      <small class="field-error">Le nom est obligatoire.</small>
    }
  </label>

  <label>
    Description
    <textarea formControlName="description" rows="3"></textarea>
  </label>

  <label>
    Prix (€) *
    <input type="number" step="0.01" min="0" formControlName="price" />
    @if (form.controls.price.touched && form.controls.price.invalid) {
      <small class="field-error">Le prix doit être positif.</small>
    }
  </label>

  <label>
    Quantité *
    <input type="number" step="1" min="0" formControlName="quantity" />
    @if (form.controls.quantity.touched && form.controls.quantity.invalid) {
      <small class="field-error">La quantité doit être positive.</small>
    }
  </label>

  <div class="buttons">
    <a routerLink="/trainings" class="btn">Annuler</a>
    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
    </button>
  </div>
</form>
